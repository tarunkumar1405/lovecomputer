<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Quiz | LOVE COMPUTER</title><link rel="stylesheet" href="quiz.css"></head><body>
<header><div class="wrap nav"><a href="index.html" class="logo">LOVE COMPUTER</a><a href="index.html">Home</a></div></header>
<main class="wrap"><section class="hero"><div class="brand">LOVE COMPUTER</div><h1>Daily Quiz</h1><p>10 mixed questions every day. A new quiz appears automatically each day.</p><strong id="date"></strong></section>
<section class="quiz"><div id="questions"></div><button id="submit">Submit Quiz</button><div id="result"></div></section></main><footer>© <span id="year"></span> LOVE COMPUTER</footer>
<script>
const days=[
[['Computer','Which component is used to store data permanently?',['RAM','SSD','CPU','Monitor'],'SSD'],['Database','Which SQL command retrieves data?',['SELECT','INSERT','UPDATE','DELETE'],'SELECT'],['Programming','Which language adds interactivity to web pages?',['HTML','CSS','JavaScript','SQL'],'JavaScript'],['History','Who is known as the Father of the Indian Constitution?',['Mahatma Gandhi','B. R. Ambedkar','Jawaharlal Nehru','Sardar Patel'],'B. R. Ambedkar'],['Geography','Which is the largest ocean on Earth?',['Atlantic Ocean','Indian Ocean','Pacific Ocean','Arctic Ocean'],'Pacific Ocean'],['India','What is the capital of India?',['Mumbai','New Delhi','Kolkata','Chennai'],'New Delhi'],['Science','What is the chemical formula of water?',['CO2','H2O','O2','NaCl'],'H2O'],['Internet','What does URL stand for?',['Universal Resource Link','Uniform Resource Locator','User Reference Link','Unified Routing Location'],'Uniform Resource Locator'],['GK','How many days are there in a leap year?',['364','365','366','367'],'366'],['Technology','What does USB stand for?',['Universal Serial Bus','United System Board','Universal Storage Block','User Service Bus'],'Universal Serial Bus']],
[['Computer','Which memory loses its data when power is removed?',['ROM','RAM','SSD','DVD'],'RAM'],['Database','Which SQL clause filters rows?',['HAVING','WHERE','ORDER BY','GROUP BY'],'WHERE'],['Programming','What defines a code block in Python?',['Braces','Indentation','XML tags','Semicolons'],'Indentation'],['History','In which year did India become independent?',['1945','1947','1950','1952'],'1947'],['Geography','The Sahara Desert is mainly in which continent?',['Asia','Africa','Europe','Australia'],'Africa'],['India','What is India’s currency?',['Dollar','Rupee','Euro','Pound'],'Rupee'],['Constitution','When did the Constitution of India come into effect?',['15 August 1947','26 January 1950','26 November 1949','2 October 1950'],'26 January 1950'],['Science','Which planet is called the Red Planet?',['Venus','Mars','Jupiter','Mercury'],'Mars'],['Internet','What does HTTPS provide in addition to HTTP?',['Encryption/security','More storage','Offline access','Larger pages'],'Encryption/security'],['GK','How many continents are commonly recognized?',['5','6','7','8'],'7']],
[['Computer','Which device is used to type text?',['Monitor','Keyboard','Speaker','Projector'],'Keyboard'],['Database','Which clause sorts SQL results?',['SORT','ORDER BY','ARRANGE','GROUP BY'],'ORDER BY'],['Programming','Which symbol starts a single-line JavaScript comment?',['<!--','//','#','**'],'//'],['History','Who was the first Prime Minister of independent India?',['Sardar Patel','Jawaharlal Nehru','Rajendra Prasad','Lal Bahadur Shastri'],'Jawaharlal Nehru'],['Geography','Which is the highest mountain above sea level?',['K2','Mount Everest','Denali','Kangchenjunga'],'Mount Everest'],['India','Which city is known as the Pink City?',['Jaipur','Pune','Surat','Lucknow'],'Jaipur'],['Constitution','Which is the lower house of India’s Parliament?',['Rajya Sabha','Lok Sabha','Supreme Court','Vidhan Parishad'],'Lok Sabha'],['Science','Which gas is needed for normal human respiration?',['Nitrogen','Oxygen','Helium','Hydrogen'],'Oxygen'],['Technology','What does CPU stand for?',['Central Processing Unit','Computer Power Unit','Central Program Utility','Core Processing Utility'],'Central Processing Unit'],['GK','How many hours are in one day?',['12','18','24','36'],'24']],
[['Computer','Which device normally has no moving mechanical parts?',['HDD','SSD','Floppy disk','Tape drive'],'SSD'],['Database','Which keyword removes duplicate SELECT results?',['UNIQUE','DISTINCT','ONLY','DIFFERENT'],'DISTINCT'],['Programming','Which type represents true or false?',['String','Boolean','Float','Character'],'Boolean'],['History','Who was the first President of India?',['Rajendra Prasad','S. Radhakrishnan','Zakir Husain','V. V. Giri'],'Rajendra Prasad'],['Geography','Which country is largest by land area?',['Canada','China','Russia','United States'],'Russia'],['India','Which ocean is named after India?',['Atlantic Ocean','Indian Ocean','Pacific Ocean','Arctic Ocean'],'Indian Ocean'],['Science','What is the nearest star to Earth?',['Sirius','The Sun','Polaris','Alpha Centauri'],'The Sun'],['Internet','What is a web browser used for?',['Accessing websites','Formatting disks','Editing hardware','Compiling CPUs'],'Accessing websites'],['Technology','What does SSD stand for?',['Solid State Drive','System Storage Disk','Secure State Device','Solid Storage Data'],'Solid State Drive'],['GK','How many minutes are in one hour?',['30','45','60','90'],'60']],
[['Computer','What is the main job of an operating system?',['Only play music','Manage hardware and software resources','Only browse the web','Only store photos'],'Manage hardware and software resources'],['Database','Which SQL statement adds a new row?',['ADD ROW','INSERT','NEW','CREATE ROW'],'INSERT'],['Programming','Which is a Python loop?',['repeat-if','for','looping','next'],'for'],['History','The Quit India Movement was launched in which year?',['1930','1942','1947','1950'],'1942'],['Geography','Which river is commonly described as India’s longest?',['Ganga','Yamuna','Narmada','Godavari'],'Ganga'],['India','Which house is called the House of the People?',['Rajya Sabha','Lok Sabha','Vidhan Sabha','Legislative Council'],'Lok Sabha'],['Constitution','What is the minimum age to become a Lok Sabha member?',['18','21','25','30'],'25'],['Science','What force pulls objects toward Earth?',['Magnetism','Gravity','Friction','Pressure'],'Gravity'],['Technology','What does GPU stand for?',['Graphics Processing Unit','General Processing Utility','Graphical Program Unit','Graphics Power Utility'],'Graphics Processing Unit'],['GK','Which metal is liquid at room temperature?',['Iron','Mercury','Copper','Aluminium'],'Mercury']]
];
function render(){const d=new Date();const n=Math.floor((new Date(d.getFullYear(),d.getMonth(),d.getDate())-new Date(2026,0,1))/86400000);const qs=days[((n%days.length)+days.length)%days.length];document.getElementById('date').textContent=d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});document.getElementById('questions').innerHTML=qs.map((q,i)=>`<article class="q" data-answer="${q[3]}"><small>${q[0]}</small><h2>${i+1}. ${q[1]}</h2>${q[2].map((o,j)=>`<label><input type="radio" name="q${i}" value="${o}"> ${String.fromCharCode(65+j)}. ${o}</label>`).join('')}<div class="ans" hidden></div></article>`).join('')}
document.getElementById('submit').onclick=()=>{let s=0;document.querySelectorAll('.q').forEach(q=>{let a=q.dataset.answer,x=q.querySelector('input:checked');q.querySelectorAll('label').forEach(l=>{let i=l.querySelector('input');i.disabled=true;if(i.value===a)l.classList.add('correct');if(x&&i===x&&i.value!==a)l.classList.add('wrong')});q.querySelector('.ans').hidden=false;q.querySelector('.ans').textContent=x&&x.value===a?'Correct!':'Correct answer: '+a;if(x&&x.value===a)s++});document.getElementById('result').textContent='Your score: '+s+' / 10';document.getElementById('submit').disabled=true};document.getElementById('year').textContent=new Date().getFullYear();render();
</script></body></html>
