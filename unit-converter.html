<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unit Converter | LOVE COMPUTER</title>
<meta name="description" content="Unit Converter - free online utility tool from LOVE COMPUTER.">
<link rel="icon" href="favicon.ico">
<style>
:root{--blue:#2563eb;--dark:#111827;--muted:#64748b;--bg:#f5f7fb}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#172033}
header{background:var(--dark);color:#fff;padding:16px 5%;display:flex;justify-content:space-between;align-items:center}
header a{color:#fff;text-decoration:none;font-weight:700}.brand{font-size:21px}.back{font-size:14px}
main{max-width:1100px;margin:auto;padding:30px 18px}.hero,.tool,.card{background:#fff;border-radius:16px;box-shadow:0 5px 20px #0000000c}
.hero{padding:28px;margin-bottom:22px}.hero h1{margin:0 0 8px}.hero p{margin:0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px}
.card{padding:19px;text-decoration:none;color:#172033;border:1px solid #e5e7eb;transition:.18s}.card:hover{transform:translateY(-2px);box-shadow:0 9px 25px #00000012}
.card h2{font-size:18px;margin:0 0 8px}.card p{font-size:14px;color:var(--muted);line-height:1.45;margin:0}
.tool{padding:28px;max-width:760px;margin:auto}.tool h1{margin-top:0}.row{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}
input,select,textarea,button{font:inherit;padding:11px 12px;border:1px solid #cbd5e1;border-radius:9px}
input,select{min-width:190px}textarea{width:100%;min-height:180px;resize:vertical}
button{background:var(--blue);color:#fff;border:0;cursor:pointer}button.secondary{background:#475569}
.result{margin-top:15px;padding:15px;background:#f1f5f9;border-radius:10px;white-space:pre-wrap;line-height:1.6;overflow:auto}
.note{font-size:13px;color:var(--muted);margin-top:14px}
footer{text-align:center;color:var(--muted);padding:30px 15px}
.qr{max-width:240px;margin-top:15px}
@media(max-width:600px){header{padding:14px}.row>*{width:100%;min-width:0}.tool{padding:21px}main{padding:20px 13px}}
</style>
</head><body>
<header><a class="brand" href="index.html">LOVE COMPUTER</a><a class="back" href="utilities.html">← All Utilities</a></header>
<main><div class="tool"><h1>Unit Converter</h1><div class="row"><input id="v" type="number" placeholder="Value"><select id="u"><option>km → miles</option><option>miles → km</option><option>kg → lb</option><option>lb → kg</option><option>°C → °F</option><option>°F → °C</option></select><button onclick="calc()">Convert</button></div><div id="out" class="result"></div></div></main>
<footer>LOVE COMPUTER — Free Online Utilities</footer>
<script>function calc(){let v=Number(document.getElementById('v').value),u=document.getElementById('u').value,x={'km → miles':v*.621371,'miles → km':v*1.609344,'kg → lb':v*2.2046226218,'lb → kg':v*.45359237,'°C → °F':v*9/5+32,'°F → °C':(v-32)*5/9}[u];out.textContent=isNaN(v)?'Enter a value.':x.toFixed(4);}</script></body></html>
