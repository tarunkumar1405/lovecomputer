<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Convert length, weight, temperature, data and time with one compact tool."><title>Advanced Unit Converter | LOVE COMPUTER</title><link rel="icon" href="favicon.ico"><style>
:root{--bg:#f6f8fc;--card:#fff;--text:#172033;--muted:#667085;--primary:#2563eb;--primary2:#1d4ed8;--border:#e4e9f2;--dark:#0b1220;--soft:#eef4ff;--danger:#b42318;--ok:#067647}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.55}
header{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}.nav{width:min(1120px,92%);margin:auto;min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-size:1.25rem;font-weight:800;text-decoration:none;color:var(--text)}.brand span{color:var(--primary)}
main{width:min(1120px,92%);margin:auto;padding:35px 0 65px}.back{color:var(--primary);font-weight:700;text-decoration:none}.hero{text-align:center;margin:18px auto 25px;max-width:780px}.eyebrow{color:var(--primary);font-size:.75rem;font-weight:800;letter-spacing:.1em}.hero h1{font-size:clamp(2rem,5vw,3.1rem);line-height:1.1;margin:7px 0 10px}.hero p{color:var(--muted);margin:0}
.tool{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:24px;box-shadow:0 10px 28px #1018280b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.field{min-width:0}label{display:block;font-size:.88rem;font-weight:750;margin:0 0 7px}input,select,textarea{width:100%;border:1px solid #d7deea;border-radius:10px;padding:11px 12px;font:inherit;background:#fff;outline:none}textarea{min-height:220px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.9rem}input:focus,select:focus,textarea:focus{border-color:#8eb0ff;box-shadow:0 0 0 3px var(--soft)}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}.btn{border:0;border-radius:9px;padding:10px 15px;background:var(--primary);color:#fff;font-weight:750;cursor:pointer}.btn:hover{background:var(--primary2)}.btn.secondary{background:#eef2f7;color:#344054}.btn.danger{background:#fee4e2;color:var(--danger)}
.result{margin-top:14px;background:#0b1220;color:#e6edf5;border-radius:11px;padding:15px;min-height:80px;white-space:pre-wrap;overflow:auto;font:13px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace}.status{margin-top:9px;color:var(--muted);font-size:.88rem}.ok{color:var(--ok)}.error{color:var(--danger)}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:#fff;border:1px solid var(--border);border-radius:15px;padding:18px;box-shadow:0 6px 20px #10182808}.card h2{font-size:1rem;margin:6px 0}.card p{color:var(--muted);font-size:.86rem;margin:0}.card a{display:inline-block;margin-top:12px;color:var(--primary);font-weight:750;text-decoration:none}
.note{color:var(--muted);font-size:.82rem;margin-top:12px}.preview{max-width:100%;border-radius:10px;border:1px solid var(--border);margin-top:12px}.meter{height:9px;background:#e9edf3;border-radius:99px;overflow:hidden}.meter span{display:block;height:100%;background:var(--primary);width:0}
footer{text-align:center;color:var(--muted);padding:30px 15px;font-size:.82rem}
@media(max-width:850px){.cards{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:1fr 1fr}}@media(max-width:650px){main{padding-top:22px}.grid,.grid3,.cards{grid-template-columns:1fr}.tool{padding:17px}.nav{min-height:60px}}
</style></head>
<body><header><div class="nav"><a class="brand" href="index.html">LOVE <span>COMPUTER</span></a><a class="back" href="utilities.html">Utilities</a></div></header>
<main><a class="back" href="utilities.html">← All Utilities</a><div class="hero"><span class="eyebrow">LOVE COMPUTER UTILITY</span><h1>Advanced Unit Converter</h1><p>Convert length, weight, temperature, data and time with one compact tool.</p></div><div class="tool"><div class="grid3"><div><label>Category</label><select id="c" onchange="load()"><option>Length</option><option>Weight</option><option>Temperature</option><option>Data</option><option>Time</option></select></div><div><label>Value</label><input id="v" type="number"></div><div><label>From → To</label><select id="u"></select></div></div><div class="actions"><button class="btn" onclick="go()">Convert</button></div><div id="o" class="result"></div></div></main><footer>LOVE COMPUTER — Practical browser utilities</footer><script>const sets={Length:["Meter","Kilometer","Centimeter","Mile","Foot","Inch"],Weight:["Gram","Kilogram","Pound","Ounce"],Temperature:["Celsius","Fahrenheit","Kelvin"],Data:["Byte","KB","MB","GB"],Time:["Second","Minute","Hour","Day"]};function load(){u.innerHTML=sets[c.value].map(x=>`<option>${x}</option>`).join("<option disabled>────────</option>")}function go(){let [a,b]=u.value.split(" → ");let v=Number(document.getElementById("v").value);if(c.value==="Temperature"){let k=a==="Celsius"?v+273.15:a==="Fahrenheit"?(v-32)*5/9+273.15:v;if(b==="Celsius")v=k-273.15;else if(b==="Fahrenheit")v=(k-273.15)*9/5+32;else v=k}else{let base={Meter:1,Kilometer:1000,Centimeter:.01,Mile:1609.344,Foot:.3048,Inch:.0254,Gram:.001,Kilogram:1,Pound:.45359237,Ounce:.0283495,Byte:1,KB:1024,MB:1048576,GB:1073741824,Second:1,Minute:60,Hour:3600,Day:86400};v=v*base[a]/base[b]}o.textContent=v.toLocaleString(undefined,{maximumFractionDigits:8})+" "+b}load();u.addEventListener("change",()=>{});function refresh(){u.innerHTML=sets[c.value].map((x,i)=>i===0?`<option value="${x} → ${sets[c.value][1]}">${x} → ${sets[c.value][1]}</option>`:`<option value="${sets[c.value][0]} → ${x}">${sets[c.value][0]} → ${x}</option>`).join("")}c.onchange=refresh;refresh()</script></body></html>
