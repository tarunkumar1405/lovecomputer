<body><header><div class="nav"><a class="brand" href="index.html">LOVE <span>COMPUTER</span></a><a class="back" href="utilities.html">Utilities</a></div></header>
<main><a class="back" href="utilities.html">← All Utilities</a><div class="hero"><span class="eyebrow">LOVE COMPUTER UTILITY</span><h1>File Size Converter</h1><p>Convert bytes, KB, MB, GB and TB using binary 1024-based units.</p></div><div class="tool"><div class="grid3"><div><label>Value</label><input id="v" type="number"></div><div><label>From</label><select id="f"><option>Bytes</option><option>KB</option><option>MB</option><option>GB</option><option>TB</option></select></div><div><label>Convert To</label><select id="t"><option>Bytes</option><option>KB</option><option>MB</option><option>GB</option><option>TB</option></select></div></div><div class="actions"><button class="btn" onclick="go()">Convert</button></div><div id="o" class="result"></div></div></main><footer>LOVE COMPUTER — Practical browser utilities</footer><script>function go(){let u={Bytes:0,KB:1,MB:2,GB:3,TB:4},v=Number(document.getElementById("v").value),f=document.getElementById("f").value,t=document.getElementById("t").value;o.textContent=(v*Math.pow(1024,u[f]-u[t])).toLocaleString(undefined,{maximumFractionDigits:6})+" "+t}</script></body></html>
